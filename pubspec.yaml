name: guia_minecraft
description: Um guia de sobrevivência e easter eggs para iniciantes no Minecraft.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/minecraft/buttons/
    - assets/minecraft/advancements/
    - assets/minecraft/backgrounds/
    - assets/minecraft/ui/
    - assets/minecraft/items/
